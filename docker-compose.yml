version: '3.8'

services:
  app:
    # Build the image from the local Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Allow overriding the runtime image (defaults to distroless Node 24 as set in the Dockerfile)
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/nodejs24-debian13}
    image: tmdb-movie-finder:distroless
    env_file:
      - .env
    ports:
      - "8989:8989"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Example usage notes:
# - To build and start the service: `docker compose up --build -d`
# - To override runtime image (for local testing):
#     RUNTIME_IMAGE=node:24-slim docker compose up --build -d
# - The compose file expects a `.env` file in the project root; it will be passed at runtime (not baked into the image).
