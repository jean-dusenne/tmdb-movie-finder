services:
  app:
    # Build the image from the local Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    image: tmdb-movie-finder:local
    ports:
      - "8989:8989"
    restart: always
    environment:
      - NUXT_TMDB_API_BASE_URL=${NUXT_TMDB_API_BASE_URL}
      - NUXT_TMDB_API_TOKEN=${NUXT_TMDB_API_TOKEN}
      - NUXT_TMDB_API_VERSION=${NUXT_TMDB_API_VERSION}
    healthcheck:
      # Use a small Node one-liner for the healthcheck. This works with node:24-slim (node available
      # in PATH). For other runtimes adapt the check accordingly.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8989/api/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "local"
